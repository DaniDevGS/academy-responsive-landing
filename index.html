<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Academia de informática más grande de Venezuela, formamos programadores en Python, Java, JavaScript y lenguajes web">
    <script src="https://kit.fontawesome.com/daf8c554e7.js" crossorigin="anonymous"></script>
    <title>Info School - Academia de Informática</title>
    <link rel="stylesheet" href="src/CSS/styles.css">
    <link rel="shortcut icon" href="./src/assets/img/Logo academia.png" type="image/png">
</head>
<body>

    <!-- Botón para abrir menú móvil -->
    <button class="menu-toggle" aria-label="Abrir menú de navegación" aria-expanded="false" aria-controls="sidebar">
        <span></span>
        <span></span>
        <span></span>
    </button>
    
    <!-- Menú lateral para móviles -->
    <aside id="sidebar" class="sidebar" aria-label="Menú de navegación principal">
        <button class="close-btn" aria-label="Cerrar menú">&times;</button>
        <nav class="sidebar-links" aria-label="Enlaces de navegación">
            <a href="#all-courses" class="sidebar-link"><i class="fa-solid fa-video"></i>Cursos</a>

            <a href="#projects" class="sidebar-link"><i class="fa-solid fa-folder"></i>Proyectos</a>

            <a href="#teachers" class="sidebar-link"><i class="fa-solid fa-chalkboard"></i> Profesores</a>


            <a href="#contact" class="sidebar-link"><i class="fa-solid fa-phone"></i>Contactos</a>

        </nav>
    </aside>
    <div class="sidebar-overlay"></div>



    <!-- Navegación principal -->
    <header>
        <nav aria-label="Navegación principal">
            <div class="nav-content">
                <div class="logo">
                    <img src="src/assets/img/Logo academia.png" alt="Logo Academia Info School">
                </div>
                <div class="nav-links">
                    <a href="#all-courses" class="nav-link"><i class="fa-solid fa-video"></i> Cursos</a>

                    <a href="#projects" class="nav-link"><i class="fa-solid fa-folder"></i> Proyectos</a>

                    <a href="#teachers" class="nav-link"><i class="fa-solid fa-chalkboard"></i> Profesores</a>

                    <a href="#contact" class="nav-link"><i class="fa-solid fa-phone"></i> Contactos</a>

                    <div class="button_login">
                        <div class="circle_button">
                            <a href="#Login"><button><i class="fa-regular fa-user"></i></button></a>
                        </div>
                        <a href="#Login" class="login">Iniciar Sesion</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>
    
    <!-- Contenido principal -->
    <main>
        <!-- Sección hero -->
        <section class="hero" aria-labelledby="hero-title">
            <div class="hero-content">
                <h1><i class="fa-thin fa-receipt" aria-hidden="true"></i>Conviértete en Desarrollador de Software <strong id="hero-title">Info School</strong></h1>
                <p>Todo lo que necesitas aprender en un sólo lugar.</p>
            </div>
        </section>

        <!-- Cursos Destacados -->
        <section class="featured" aria-labelledby="featured-courses">
            <h2 id="featured-courses" class="section-title">Cursos destacados</h2>
            <div class="hero-grid" id="featured-grid">
                
            </div>
        </section>

        <!-- Todos los cursos -->
        <section class="featured" aria-labelledby="all-courses">
            <h2 id="all-courses" class="section-title">Todos los cursos</h2>
            <div class="hero-grid" id="all-courses-grid">
                

            </div>
        </section>
    </main>

    <!-- Pie de página -->
    <footer>
        <div class="footer-content">
            <div class="footer-info">
                <a href="#">
                    <img src="src/assets/img/Logo academia.png" alt="Info School" width="90">
                </a>
            </div>

            <p class="copyright">&copy; 2025 Info School. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="src/JS/script.js"></script>
    <script type="module" src="src/JS/main.js"></script>
</body>
</html>
